<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sơ Đồ Quy Trình Nghiệp Vụ Kho Vận RFID (WMS Business Process)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: #0B1120;
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #1E293B;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      background: #0284C7;
      color: white;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
    }
    .title h1 {
      font-size: 17px;
      font-weight: bold;
      color: #F8FAFC;
    }
    .title p {
      font-size: 12px;
      color: #94A3B8;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    .btn {
      background: #334155;
      color: white;
      border: 1px solid #475569;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #0284C7;
      border-color: #38BDF8;
    }
    .btn-primary {
      background: #10B981;
      border-color: #34D399;
    }
    .btn-primary:hover {
      background: #059669;
    }
    main {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #0B1120;
      position: relative;
    }
    .img-wrapper {
      max-width: 100%;
      max-height: 100%;
      transition: transform 0.15s ease-out;
      transform-origin: center center;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .controls {
      position: absolute;
      bottom: 24px;
      right: 24px;
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(8px);
      padding: 6px;
      border-radius: 8px;
      border: 1px solid #475569;
      display: flex;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .ctrl-btn {
      background: #334155;
      color: white;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }
    .ctrl-btn:hover {
      background: #0284C7;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="badge">NGHIỆP VỤ KHO</span>
      <div class="title">
        <h1>Sơ Đồ Quy Trình Nghiệp Vụ Kho Vận RFID (WMS Business Process Model)</h1>
        <p>5 làn bơi phân quyền: Đối tác, Mua hàng/Kinh doanh, Kế toán/Trưởng kho, Thủ kho/Xe nâng, Hệ thống RFID</p>
      </div>
    </div>
    <div class="actions">
      <a class="btn btn-primary" href="SO_DO_NGHIEP_VU_KHO.png" download>
        📥 Tải Ảnh Độ Phân Giải Cao (.PNG)
      </a>
      <a class="btn" href="DrawIO_Editor.html">
        ✏️ Mở Trong Draw.io Editor
      </a>
    </div>
  </header>

  <main id="viewport">
    <div class="img-wrapper" id="img-wrapper">
      <img src="SO_DO_NGHIEP_VU_KHO.png" alt="Sơ Đồ Quy Trình Nghiệp Vụ Kho RFID">
    </div>

    <div class="controls">
      <button class="ctrl-btn" onclick="zoom(0.15)">+</button>
      <button class="ctrl-btn" onclick="zoom(-0.15)">−</button>
      <button class="ctrl-btn" onclick="resetZoom()">1:1</button>
      <button class="ctrl-btn" onclick="fitWidth()">↔</button>
    </div>
  </main>

  <script>
    let scale = 1.0;
    const wrapper = document.getElementById('img-wrapper');

    function zoom(delta) {
      scale = Math.max(0.4, Math.min(3.5, scale + delta));
      wrapper.style.transform = `scale(${scale})`;
    }

    function resetZoom() {
      scale = 1.0;
      wrapper.style.transform = `scale(1.0)`;
    }

    function fitWidth() {
      scale = 1.35;
      wrapper.style.transform = `scale(1.35)`;
    }
  </script>
</body>
</html>
