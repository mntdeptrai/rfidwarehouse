      padding: 24px;
    }

      display: none;

      transition: transform 0.1s ease;
      transform-origin: top center;
    }
    .page-container.active {
      display: block;
    }
    .flow-node {
      cursor: pointer;
      transition: transform 0.15s;
    }
    .flow-node:hover {
      filter: brightness(1.1);
    }

      position: absolute;

      right: 24px;

  <script>
    let currentZoom = 1.0;
    let currentTab = 0;

    function switchTab(index) {
      currentTab = index;
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
      });
      document.querySelectorAll('.page-container').forEach((page, i) => {
        page.classList.toggle('active', i === index);
      });
      resetZoom();
    }

    function zoom(delta) {
      currentZoom = Math.max(0.4, Math.min(2.5, currentZoom + delta));
      const activePage = document.querySelector('.page-container.active');
      if (activePage) {
        activePage.style.transform = `scale(${currentZoom})`;
      }
    }

    function resetZoom() {
      currentZoom = 1.0;
      const activePage = document.querySelector('.page-container.active');
      if (activePage) {
        activePage.style.transform = `scale(1.0)`;
      }
    }
  </script>
